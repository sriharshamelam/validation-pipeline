version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: dq_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: data_quality_db
      MYSQL_USER: dq_user
      MYSQL_PASSWORD: dq_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: dq_redis
    ports:
      - "6379:6379"
volumes:
  mysql_data:
